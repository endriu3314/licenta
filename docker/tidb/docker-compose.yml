services:
  pd:
    image: pingcap/pd:v8.5.5
    ports:
      - "2379:2379"
    command:
      - --name=pd
      # - --log-level=error
      - --log-file=/dev/null
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
      - --data-dir=/data/pd
    volumes:
      - pd_data:/data
    restart: on-failure

  tikv0:
    image: pingcap/tikv:v8.5.5
    depends_on:
      - pd
    command:
      # - --log-level=error
      - --log-file=/dev/null
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv0:20160
      - --data-dir=/data/tikv
      - --pd=pd:2379
    volumes:
      - tikv0_data:/data
    restart: on-failure

  tikv1:
    image: pingcap/tikv:v8.5.5
    depends_on:
      - pd
    command:
      # - --log-level=error
      - --log-file=/dev/null
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv1:20160
      - --data-dir=/data/tikv
      - --pd=pd:2379
    volumes:
      - tikv1_data:/data
    restart: on-failure

  tikv2:
    image: pingcap/tikv:v8.5.5
    depends_on:
      - pd
    command:
      # - --log-level=error
      - --log-file=/dev/null
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv2:20160
      - --data-dir=/data/tikv
      - --pd=pd:2379
    volumes:
      - tikv2_data:/data
    restart: on-failure

  tidb:
    image: pingcap/tidb:v8.5.5
    depends_on:
      - tikv0
      - tikv1
      - tikv2
    ports:
      - "4000:4000"
      - "10080:10080"
    command:
      - --store=tikv
      - --path=pd:2379
      - --log-file=/dev/null
    restart: on-failure

volumes:
  pd_data:
  tikv0_data:
  tikv1_data:
  tikv2_data: